name: Phone build

# Builds a debug APK of a branch and attaches it to a pre-release named after the branch, so it can
# be downloaded straight to a phone from the Releases page. Runs on every push to a branch other
# than main, or by hand from the Actions tab.

on:
  push:
    branches-ignore: [ main ]
  workflow_dispatch:

env:
  CI: true

permissions:
  contents: write

concurrency:
  group: 'phone-build-${{ github.ref_name }}'
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-java
      - uses: ./.github/actions/setup-gradle
      - uses: ./.github/actions/setup-gradle-properties
      - run: ./gradlew :aktual-app:android:assembleDebug

      - name: Publish to the branch's pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="build-${BRANCH//\//-}"
          apk="aktual-${BRANCH//\//-}-debug.apk"
          cp aktual-app/android/build/outputs/apk/debug/*.apk "$apk"
          notes="Debug build of \`$BRANCH\` at ${GITHUB_SHA::7}. Installs as a separate app (Aktual Dev)."

          # A fresh release each time, so the Releases page shows when this build was made. Editing
          # the old one would keep its original date.
          gh release delete "$tag" --yes --cleanup-tag || true
          git push origin ":refs/tags/$tag" || true
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          gh release create "$tag" "$apk" \
            --title "Phone build: $BRANCH ($(date -u +'%b %-d, %H:%M UTC'))" \
            --notes "$notes" --prerelease
